server {
    # 前端容器对外端口（docker run -p 3000:3000）
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（用户头像 / Banner 等）
    client_max_body_size 8m;

    # SPA: 所有路由 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（vite 产物带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端容器
    # 172.17.0.1 = 宿主机在 docker 默认网桥（docker0）上的地址。
    # 后端容器以 `docker run -p 8000:8000` 发布到宿主机，因此这里指向宿主机即可；
    # 两个容器各自独立运行时，用宿主网桥地址比容器名更可靠。
    location /api/ {
        proxy_pass http://172.17.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

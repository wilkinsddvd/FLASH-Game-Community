server {
    # 前端容器对外端口（docker run -p 3000:3000）
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（用户头像 / Banner 等）
    client_max_body_size 8m;

    # ── 压缩 ───────────────────────────────────────────────
    # octet-stream = 高程 .bin（488KB/图，压缩比很高），必须列入
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/octet-stream
        image/svg+xml;

    # ── SPA 入口：不缓存，保证发版即生效 ────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: 所有路由 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（vite 产物带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 业务静态资源（文件名不带 hash）─────────────────────
    # 图片/字体：内容基本不动 → 30 天
    location ~* ^/squad-assets/.+\.(webp|png|jpe?g|gif|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 数据文件（高程 .bin / 等高线 meta 等）：7 天，缺文件直接 404，
    # 避免 fallback 成 index.html 被前端当二进制解析
    location ~* ^/squad-assets/.+\.(bin|json|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /squad-assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API 反向代理到后端容器
    # 172.17.0.1 = 宿主机在 docker 默认网桥（docker0）上的地址。
    # 后端容器以 `docker run -p 8000:8000` 发布到宿主机，因此这里指向宿主机即可；
    # 两个容器各自独立运行时，用宿主网桥地址比容器名更可靠。
    location /api/ {
        proxy_pass http://172.17.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

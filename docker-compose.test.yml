# 本地 staging（独立库/Redis/端口），只用于功能与压测
# 用法：
#   docker compose -f docker-compose.test.yml up -d --build
#   前端 http://localhost:3002
#   后端 http://localhost:8001
#   测试库 MySQL 3307 / Redis 6380
# 注意：不要指向生产库；压测只打这里。
services:
  db:
    image: mysql:8.0
    container_name: flash-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: flash_game_community_test
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - flash_test_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: flash-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./FLASH_END_PRO
      dockerfile: Dockerfile
    container_name: flash-test-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DB_ENV: local
      DATABASE_URL: mysql+aiomysql://root:123456@db:3306/flash_game_community_test
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: flash-test-only-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: flash-test-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./frontend/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  flash_test_mysql_data:
